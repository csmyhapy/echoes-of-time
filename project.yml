name: EchoesOfTime

options:
  bundleIdPrefix: life.lifememory
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  EchoesOfTime:
    type: application
    platform: iOS
    sources:
      - path: EchoesOfTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.lifememory.echosoftime
        PRODUCT_NAME: EchoesOfTime
        INFOPLIST_FILE: EchoesOfTime/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  EchoesOfTime:
    build:
      targets:
        EchoesOfTime: all
    run:
      config: Debug
    archive:
      config: Release
